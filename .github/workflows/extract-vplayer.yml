name: Extract Vplayer archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[skip-extract]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract nested archives
        run: |
          set -e
          rm -rf resources smali sources
          mkdir -p resources smali sources
          unzip -q Vplayer.zip -d /tmp/vplayer
          unzip -q /tmp/vplayer/resources/resources.zip -d resources
          unzip -q /tmp/vplayer/smali/smali.zip -d smali
          unzip -q /tmp/vplayer/sources/sources.zip -d sources
          rm -f Vplayer.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decompress Vplayer into main [skip-extract]" || exit 0
          git push
