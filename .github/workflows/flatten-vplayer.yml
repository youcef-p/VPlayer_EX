name: Flatten Vplayer folders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  flatten:
    if: ${{ !contains(github.event.head_commit.message, '[skip-flatten]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flatten extracted directories
        run: |
          set -e
          for d in resources smali sources; do
            if [ -d "$d/$d" ]; then
              cp -a "$d/$d/." "$d/"
              rm -rf "$d/$d"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Flatten Vplayer folders [skip-flatten]" || exit 0
          git push
